      50% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }

      { id: 'h100', name: '100시간 클럽', desc: '누적 100시간', icon: '💯' },
      { id: 'h500', name: '500시간 마스터', desc: '누적 500시간', icon: '🏅' },
      { id: 'h1000', name: '천시간의 전설', desc: '누적 1000시간', icon: '👑' },
      { id: 'fullrange', name: '풀 레인지', desc: '5개 카테고리 모두', icon: '🎯' },
      { id: 'marathon', name: '마라토너', desc: '하루 4시간 이상', icon: '🏃' },
      { id: 'early', name: '새벽 호랑이', desc: '오전 6시 이전 훈련', icon: '🌅' },
    ];

    // ============== HELPERS ==============
    const checkAchievement = (id, sessions, streak, totalHours) => {
      switch (id) {
        case 'first': return sessions.length >= 1;
        case 'week': return streak >= 7;
        case 'month': return streak >= 30;
        case 'h100': return totalHours >= 100;
        case 'h500': return totalHours >= 500;
        case 'h1000': return totalHours >= 1000;
        case 'fullrange': return new Set(sessions.map(s => s.category)).size >= 5;
        case 'marathon': {
          const byDay = {};
          sessions.forEach(s => { byDay[s.date] = (byDay[s.date] || 0) + s.duration; });
          return Object.values(byDay).some(v => v >= 240);
        }
        case 'early': return sessions.some(s => typeof s.hour === 'number' && s.hour < 6);
        default: return false;
      }
    };

    const todayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const koreanDate = () => {
      const d = new Date();
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      return `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
    };

    const calcStreak = (sessions) => {
      if (!sessions.length) return 0;
      const dates = [...new Set(sessions.map(s => s.date))].sort().reverse();
      let streak = 0;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      for (const dateStr of dates) {
        const d = new Date(dateStr + 'T00:00:00');
        const diff = Math.floor((today - d) / 86400000);
        if (diff === streak) streak++;
        else if (diff > streak) break;
      }
      return streak;
    };

    const getCategory = (id) => CATEGORIES.find(c => c.id === id) || CATEGORIES[0];

    const daysBetween = (start, end) => {
      const s = new Date(start + 'T00:00:00');
      const e = new Date(end + 'T00:00:00');
      return Math.max(0, Math.ceil((e - s) / 86400000));
    };

    // ============== STORAGE ==============
    const storage = {
      get(key) {
        try {
          const v = localStorage.getItem(key);
          return v ? JSON.parse(v) : null;
        } catch (e) { return null; }
      },
      set(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (e) { return false; }
      }
    };

    // ============== CHART COMPONENTS ==============
    const SimpleBarChart = ({ data }) => {
      const max = Math.max(...data.map(d => d.value), 60);
      return (
        <div className="flex items-end justify-between gap-2" style={{ height: 140 }}>
          {data.map((d, i) => {
            const heightPct = max > 0 ? (d.value / max) * 100 : 0;
            const isToday = i === data.length - 1;
            return (
              <div key={i} className="flex-1 flex flex-col items-center gap-2 h-full">
                <div className="w-full flex-1 flex flex-col justify-end relative">
                  {d.value > 0 && (
                    <div className="absolute -top-5 left-0 right-0 text-center text-[10px] text-stone-400 font-mono">
                      {d.value}
                    </div>
                  )}
                  <div
                    className={`w-full rounded-t-md transition-all duration-500 ${isToday ? 'bg-gradient-to-t from-amber-500 to-amber-300' : 'bg-gradient-to-t from-emerald-600 to-emerald-400'}`}
                    style={{ height: `${heightPct}%`, minHeight: d.value > 0 ? '4px' : '0' }}
                  />
                </div>
                <div className={`text-xs font-medium ${isToday ? 'text-amber-400' : 'text-stone-500'}`}>{d.label}</div>
              </div>
            );
          })}
        </div>
      );
    };

    const SimplePieChart = ({ data, size = 120 }) => {
      const total = data.reduce((s, d) => s + d.value, 0);
      if (total === 0) return null;
      const cx = size / 2;
      const cy = size / 2;
      const r = size / 2 - 4;
      const innerR = r * 0.55;
      let cumulative = 0;
      const paths = data.map((d, i) => {
        const angle = (d.value / total) * Math.PI * 2;
        const startAngle = cumulative - Math.PI / 2;
        const endAngle = startAngle + angle;
        cumulative += angle;
        const x1 = cx + Math.cos(startAngle) * r;
        const y1 = cy + Math.sin(startAngle) * r;
        const x2 = cx + Math.cos(endAngle) * r;
        const y2 = cy + Math.sin(endAngle) * r;
        const x3 = cx + Math.cos(endAngle) * innerR;
        const y3 = cy + Math.sin(endAngle) * innerR;
        const x4 = cx + Math.cos(startAngle) * innerR;
        const y4 = cy + Math.sin(startAngle) * innerR;
        const largeArc = angle > Math.PI ? 1 : 0;
        const path = `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${x3} ${y3} A ${innerR} ${innerR} 0 ${largeArc} 0 ${x4} ${y4} Z`;
        return <path key={i} d={path} fill={d.color} />;
      });
      return <svg width={size} height={size}>{paths}</svg>;
    };

    // ============== APP ==============
    function App() {
      const [tab, setTab] = useState('home');
      const [sessions, setSessions] = useState([]);
      const [profile, setProfile] = useState(null);
      const [goals, setGoals] = useState({ dailyMinutes: 120, weeklyMinutes: 840 });
      const [unlocked, setUnlocked] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showAdd, setShowAdd] = useState(false);
      const [showOnboard, setShowOnboard] = useState(false);
      const [newAch, setNewAch] = useState(null);
      const [quote] = useState(QUOTES[Math.floor(Math.random() * QUOTES.length)]);

      useEffect(() => {
        const p = storage.get('profile');
        const s = storage.get('sessions');
        const g = storage.get('goals');
        const a = storage.get('achievements');
        if (p) setProfile(p); else setShowOnboard(true);
        if (s) setSessions(s);
        if (g) setGoals(g);
        if (a) setUnlocked(a);
        setLoading(false);
        // hide splash
        const splash = document.getElementById('splash');
        if (splash) setTimeout(() => splash.style.display = 'none', 200);
      }, []);

      useEffect(() => {
        if (loading) return;
        const totalHours = sessions.reduce((s, x) => s + x.duration, 0) / 60;
        const streak = calcStreak(sessions);
        let updated = unlocked;
        let newest = null;
        ACHIEVEMENTS.forEach(a => {
          if (!updated.includes(a.id) && checkAchievement(a.id, sessions, streak, totalHours)) {
            updated = [...updated, a.id];
            newest = a;
          }
        });
        if (newest) {
          setUnlocked(updated);
          storage.set('achievements', updated);
          setNewAch(newest);
          setTimeout(() => setNewAch(null), 4500);
        }
      }, [sessions, loading]);

      const saveProfile = (p) => {
        setProfile(p);
        setShowOnboard(false);
        storage.set('profile', p);
      };
      const addSession = (session) => {
        const newSession = { ...session, id: Date.now() };
        const list = [...sessions, newSession];
        setSessions(list);
        setShowAdd(false);
        storage.set('sessions', list);
      };
      const deleteSession = (id) => {
        const list = sessions.filter(s => s.id !== id);
        setSessions(list);
        storage.set('sessions', list);
      };
      const updateGoals = (g) => {
        setGoals(g);
        storage.set('goals', g);
      };

      if (loading) return null;
      if (showOnboard) return <Onboarding onComplete={saveProfile} />;

      const today = todayStr();
      const todayMin = sessions.filter(s => s.date === today).reduce((sum, s) => sum + s.duration, 0);
      const totalMin = sessions.reduce((sum, s) => sum + s.duration, 0);
      const totalHours = totalMin / 60;
      const streak = calcStreak(sessions);
      const todayProgress = Math.min(100, (todayMin / goals.dailyMinutes) * 100);

      return (
        <div className="min-h-screen bg-stone-950 text-stone-100 pb-32 relative overflow-x-hidden">
          <div className="fixed inset-0 pointer-events-none z-0">
            <div className="absolute -top-32 -left-32 w-96 h-96 bg-emerald-500/15 rounded-full blur-3xl"></div>
            <div className="absolute top-1/2 -right-32 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>
            <div className="absolute bottom-0 left-1/3 w-96 h-96 bg-emerald-700/10 rounded-full blur-3xl"></div>
          </div>
          <div className="grain"></div>

          <div className="relative z-10">
            {tab === 'home' && (
              <HomeView profile={profile} sessions={sessions} streak={streak} todayMin={todayMin}
                todayProgress={todayProgress} totalHours={totalHours} goals={goals} quote={quote}
                onAdd={() => setShowAdd(true)} onDelete={deleteSession} />
            )}
            {tab === 'log' && <LogView sessions={sessions} onDelete={deleteSession} onAdd={() => setShowAdd(true)} />}
            {tab === 'stats' && <StatsView sessions={sessions} totalHours={totalHours} streak={streak} />}
            {tab === 'goals' && (
              <GoalsView profile={profile} goals={goals} unlocked={unlocked} sessions={sessions}
                onUpdateGoals={updateGoals} onUpdateProfile={saveProfile} />
            )}
          </div>

          <BottomNav tab={tab} setTab={setTab} onAdd={() => setShowAdd(true)} />
          {showAdd && <AddSessionModal onSave={addSession} onClose={() => setShowAdd(false)} />}

          {newAch && (
            <div className="fixed top-6 left-4 right-4 z-50 anim-slide-up pt-safe">
              <div className="bg-gradient-to-r from-emerald-600 to-emerald-500 rounded-2xl p-4 shadow-2xl flex items-center gap-3 border border-emerald-400">
                <div className="text-4xl">{newAch.icon}</div>
                <div className="flex-1">
                  <div className="text-xs text-emerald-100 font-semibold tracking-wider">업적 달성!</div>
                  <div className="font-bold text-white">{newAch.name}</div>
                  <div className="text-xs text-emerald-100">{newAch.desc}</div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============== ONBOARDING ==============
    function Onboarding({ onComplete }) {
      const [name, setName] = useState('');
      const [targetDate, setTargetDate] = useState('');
      const [step, setStep] = useState(0);

      return (
        <div className="min-h-screen bg-stone-950 text-stone-100 flex flex-col p-6 relative overflow-hidden">
          <div className="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-emerald-500/20 to-transparent"></div>
          <div className="absolute bottom-0 right-0 w-72 h-72 bg-amber-500/10 rounded-full blur-3xl"></div>

          <div className="relative z-10 flex-1 flex flex-col justify-center max-w-md mx-auto w-full pt-safe">
            {step === 0 && (
              <div className="anim-pop">
                <div className="text-7xl mb-6">⛳</div>
                <h1 className="text-4xl font-bold mb-3 leading-tight">
                  프로골퍼의<br />
                  <span className="bg-gradient-to-r from-emerald-400 to-amber-400 bg-clip-text text-transparent">
                    여정이 시작됩니다
                  </span>
                </h1>
                <p className="text-stone-400 mb-12 leading-relaxed">
                  매일의 훈련을 기록하고, 연속 기록을 쌓고,<br />
                  꿈에 한 걸음씩 다가가는 트레이닝 동반자.
                </p>
                <button onClick={() => setStep(1)}
                  className="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-emerald-500/30 active:scale-95 transition-transform">
                  시작하기
                </button>
              </div>
            )}
            {step === 1 && (
              <div className="anim-pop">
                <div className="text-sm text-emerald-400 font-semibold tracking-widest mb-3">STEP 1 / 2</div>
                <h2 className="text-3xl font-bold mb-8">이름이 뭐야?</h2>
                <input type="text" value={name} onChange={(e) => setName(e.target.value)}
                  placeholder="예: 김도전" autoFocus
                  className="w-full bg-stone-900 border border-stone-800 rounded-2xl px-5 py-4 text-lg text-stone-100 placeholder-stone-600 focus:border-emerald-500 outline-none mb-6" />
                <button onClick={() => name.trim() && setStep(2)} disabled={!name.trim()}
                  className="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-emerald-500/30 active:scale-95 transition-transform disabled:opacity-40">
                  다음
                </button>
              </div>
            )}
            {step === 2 && (
              <div className="anim-pop">
                <div className="text-sm text-emerald-400 font-semibold tracking-widest mb-3">STEP 2 / 2</div>
                <h2 className="text-3xl font-bold mb-3">프로 자격증 목표일은?</h2>
                <p className="text-stone-400 mb-8">목표가 명확할수록 길이 분명해진다.</p>
                <input type="date" value={targetDate} onChange={(e) => setTargetDate(e.target.value)}
                  className="w-full bg-stone-900 border border-stone-800 rounded-2xl px-5 py-4 text-lg text-stone-100 focus:border-emerald-500 outline-none mb-6" />
                <button onClick={() => onComplete({ name, targetDate, startDate: todayStr() })}
                  disabled={!targetDate}
                  className="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-emerald-500/30 active:scale-95 transition-transform disabled:opacity-40">
                  여정 시작하기
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============== HOME VIEW ==============
    function HomeView({ profile, sessions, streak, todayMin, todayProgress, totalHours, goals, quote, onAdd, onDelete }) {
      const recentSessions = [...sessions].sort((a, b) => b.id - a.id).slice(0, 3);
      const todaysSessions = sessions.filter(s => s.date === todayStr());

      return (
        <div className="px-5 pt-safe pb-4">
          <div className="mb-6">
            <div className="text-xs text-stone-500 tracking-widest mb-1 font-semibold">{koreanDate().toUpperCase()}</div>
            <div className="text-2xl font-bold text-stone-100">
              안녕, <span className="text-emerald-400">{profile?.name}</span>
            </div>
          </div>

          <div className="bg-gradient-to-br from-stone-900 to-stone-900/50 border border-stone-800 rounded-3xl p-5 mb-4 relative overflow-hidden">
            <div className="absolute -top-10 -right-10 w-40 h-40 bg-emerald-500/10 rounded-full blur-2xl"></div>
            <div className="relative z-10 flex items-start justify-between mb-4">
              <div>
                <div className="text-xs text-stone-500 font-semibold tracking-wider mb-1">오늘의 진행</div>
                <div className="flex items-baseline gap-1">
                  <span className="font-display text-5xl text-stone-100">{todayMin}</span>
                  <span className="text-stone-400 text-sm">분 / {goals.dailyMinutes}분</span>
                </div>
              </div>
              <div className="text-right">
                <div className="text-xs text-stone-500 font-semibold tracking-wider mb-1">달성률</div>
                <div className={`font-display text-3xl ${todayProgress >= 100 ? 'text-amber-400' : 'text-emerald-400'}`}>
                  {Math.round(todayProgress)}%
                </div>
              </div>
            </div>
            <div className="relative z-10 h-2 bg-stone-800 rounded-full overflow-hidden">
              <div className={`h-full rounded-full transition-all duration-700 ${todayProgress >= 100 ? 'bg-gradient-to-r from-amber-400 to-yellow-300' : 'bg-gradient-to-r from-emerald-500 to-emerald-400'}`}
                style={{ width: `${todayProgress}%` }}></div>
            </div>
            {todayProgress >= 100 && (
              <div className="relative z-10 mt-3 text-sm text-amber-400 font-semibold flex items-center gap-1">
                <Trophy size={16} /> 오늘 목표 달성! 🎉
              </div>
            )}
          </div>

          <div className="grid grid-cols-2 gap-3 mb-4">
            <div className="bg-gradient-to-br from-orange-600/20 to-rose-600/10 border border-rose-500/20 rounded-2xl p-4">
              <Flame size={20} className="text-orange-400 mb-2" />
              <div className="font-display text-4xl text-orange-300">{streak}</div>
              <div className="text-xs text-stone-400 mt-1">연속 일수</div>
            </div>
            <div className="bg-gradient-to-br from-emerald-600/20 to-teal-600/10 border border-emerald-500/20 rounded-2xl p-4">
              <Clock size={20} className="text-emerald-400 mb-2" />
              <div className="font-display text-4xl text-emerald-300">{totalHours.toFixed(1)}</div>
              <div className="text-xs text-stone-400 mt-1">누적 시간</div>
            </div>
          </div>

          <div className="bg-gradient-to-r from-amber-900/30 via-yellow-900/20 to-amber-900/30 border border-amber-500/20 rounded-2xl p-4 mb-6">
            <div className="flex items-start gap-3">
              <div className="text-xl">"</div>
              <div className="flex-1">
                <div className="text-stone-200 leading-relaxed text-sm">{quote}</div>
                <div className="text-xs text-amber-400/70 mt-2 tracking-wider">오늘의 한 마디</div>
              </div>
            </div>
          </div>

          <div className="mb-4">
            <div className="flex items-center justify-between mb-3">
              <h2 className="text-base font-bold text-stone-200">빠른 기록</h2>
              <span className="text-xs text-stone-500">카테고리를 탭하세요</span>
            </div>
            <div className="grid grid-cols-5 gap-2">
              {CATEGORIES.map(cat => {
                const Icon = cat.icon;
                const count = todaysSessions.filter(s => s.category === cat.id).length;
                return (
                  <button key={cat.id} onClick={onAdd}
                    className={`${cat.soft} ring-1 ${cat.ring} rounded-2xl p-3 flex flex-col items-center gap-2 active:scale-95 transition-transform relative`}>
                    <Icon size={20} className={cat.text} />
                    <span className="text-xs text-stone-300 font-medium leading-tight text-center">{cat.name}</span>
                    {count > 0 && (
                      <div className="absolute -top-1 -right-1 bg-emerald-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">
                        {count}
                      </div>
                    )}
                  </button>
                );
              })}
            </div>
          </div>

          <div>
            <h2 className="text-base font-bold text-stone-200 mb-3">최근 기록</h2>
            {recentSessions.length === 0 ? (
              <div className="bg-stone-900/50 border border-dashed border-stone-800 rounded-2xl p-8 text-center">
                <div className="text-4xl mb-2">⛳</div>
                <div className="text-stone-400 text-sm mb-3">첫 훈련을 기록해 보자.</div>
                <button onClick={onAdd} className="text-emerald-400 text-sm font-semibold">+ 시작하기</button>
              </div>
            ) : (
              <div className="space-y-2">
                {recentSessions.map(s => <SessionCard key={s.id} session={s} onDelete={onDelete} />)}
              </div>
            )}
          </div>
        </div>
      );
    }

    function SessionCard({ session, onDelete }) {
      const cat = getCategory(session.category);
      const Icon = cat.icon;
      const [confirm, setConfirm] = useState(false);
      return (
        <div className="bg-stone-900/60 border border-stone-800 rounded-2xl p-4 flex items-center gap-3">
          <div className={`${cat.soft} w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0`}>
            <Icon size={20} className={cat.text} />
          </div>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2">
              <span className="font-semibold text-stone-100">{cat.name}</span>
              <span className="text-xs text-stone-500">{session.date}</span>
            </div>
            <div className="text-sm text-stone-400 mt-0.5">{session.duration}분 훈련</div>
            {session.notes && <div className="text-xs text-stone-500 mt-1 truncate">{session.notes}</div>}
          </div>
          {confirm ? (
            <button onClick={() => onDelete(session.id)} className="text-rose-400 p-2"><Check size={18} /></button>
          ) : (
            <button onClick={() => setConfirm(true)} className="text-stone-600 p-2 active:text-rose-400"><Trash2 size={16} /></button>
          )}
        </div>
      );
    }

    // ============== LOG VIEW ==============
    function LogView({ sessions, onDelete, onAdd }) {
      const sorted = [...sessions].sort((a, b) => b.id - a.id);
      const grouped = {};
      sorted.forEach(s => {
        if (!grouped[s.date]) grouped[s.date] = [];
        grouped[s.date].push(s);
      });

      return (
        <div className="px-5 pt-safe pb-4">
          <div className="flex items-center justify-between mb-6">
            <div>
              <div className="text-xs text-stone-500 tracking-widest font-semibold">TRAINING LOG</div>
              <h1 className="text-3xl font-bold text-stone-100 mt-1">훈련 기록</h1>
            </div>
            <div className="font-display text-2xl text-emerald-400">{sessions.length}</div>
          </div>

          {Object.keys(grouped).length === 0 ? (
            <div className="bg-stone-900/50 border border-dashed border-stone-800 rounded-2xl p-12 text-center">
              <BookOpen size={32} className="text-stone-600 mx-auto mb-3" />
              <div className="text-stone-400 text-sm mb-4">아직 기록이 없어요.</div>
              <button onClick={onAdd} className="bg-emerald-500 text-white font-semibold px-5 py-2 rounded-xl text-sm">
                첫 기록 추가
              </button>
            </div>
          ) : (
            <div className="space-y-6">
              {Object.entries(grouped).map(([date, items]) => {
                const totalMin = items.reduce((sum, s) => sum + s.duration, 0);
                return (
                  <div key={date}>
                    <div className="flex items-center justify-between mb-2 px-1">
                      <div className="text-sm font-semibold text-stone-400">{date}</div>
                      <div className="text-xs text-stone-500 font-mono">{totalMin}분</div>
                    </div>
                    <div className="space-y-2">
                      {items.map(s => <SessionCard key={s.id} session={s} onDelete={onDelete} />)}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ============== STATS VIEW ==============
    function StatsView({ sessions, totalHours, streak }) {
      const last7Days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const minutes = sessions.filter(s => s.date === dateStr).reduce((sum, s) => sum + s.duration, 0);
        last7Days.push({ label: ['일', '월', '화', '수', '목', '금', '토'][d.getDay()], value: minutes });
      }

      const categoryData = CATEGORIES.map(cat => {
        const minutes = sessions.filter(s => s.category === cat.id).reduce((sum, s) => sum + s.duration, 0);
        return { name: cat.name, value: minutes, color: cat.color, id: cat.id };
      }).filter(d => d.value > 0);

      const last7Total = last7Days.reduce((sum, d) => sum + d.value, 0);
      const avgPerDay = last7Total / 7;

      return (
        <div className="px-5 pt-safe pb-4">
          <div className="mb-6">
            <div className="text-xs text-stone-500 tracking-widest font-semibold">PERFORMANCE</div>
            <h1 className="text-3xl font-bold text-stone-100 mt-1">통계 분석</h1>
          </div>

          <div className="grid grid-cols-3 gap-2 mb-6">
            <StatCard label="누적시간" value={totalHours.toFixed(0)} unit="h" />
            <StatCard label="연속일수" value={streak} unit="일" />
            <StatCard label="총 세션" value={sessions.length} unit="회" />
          </div>

          <div className="bg-stone-900/60 border border-stone-800 rounded-2xl p-4 mb-4">
            <div className="flex items-center justify-between mb-4">
              <div>
                <div className="text-xs text-stone-500 tracking-wider font-semibold">최근 7일</div>
                <div className="text-lg font-bold text-stone-100 mt-1">주간 훈련량</div>
              </div>
              <div className="text-right">
                <div className="font-display text-2xl text-emerald-400">{(last7Total / 60).toFixed(1)}h</div>
                <div className="text-xs text-stone-500">평균 {Math.round(avgPerDay)}분/일</div>
              </div>
            </div>
            <SimpleBarChart data={last7Days} />
          </div>

          {categoryData.length > 0 && (
            <div className="bg-stone-900/60 border border-stone-800 rounded-2xl p-4 mb-4">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <div className="text-xs text-stone-500 tracking-wider font-semibold">CATEGORY MIX</div>
                  <div className="text-lg font-bold text-stone-100 mt-1">카테고리 비중</div>
                </div>
              </div>
              <div className="flex items-center gap-4">
                <SimplePieChart data={categoryData} size={120} />
                <div className="flex-1 space-y-2">
                  {categoryData.map(c => {
                    const total = categoryData.reduce((s, x) => s + x.value, 0);
                    const pct = total > 0 ? (c.value / total) * 100 : 0;
                    return (
                      <div key={c.id} className="flex items-center gap-2 text-sm">
                        <div className="w-2 h-2 rounded-full" style={{ background: c.color }}></div>
                        <span className="text-stone-300 flex-1">{c.name}</span>
                        <span className="text-stone-500 font-mono text-xs">{pct.toFixed(0)}%</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {sessions.length === 0 && (
            <div className="bg-stone-900/50 border border-dashed border-stone-800 rounded-2xl p-8 text-center">
              <BarChart3 size={32} className="text-stone-600 mx-auto mb-3" />
              <div className="text-stone-400 text-sm">기록이 쌓이면 분석이 나타나요.</div>
            </div>
          )}
        </div>
      );
    }

    function StatCard({ label, value, unit }) {
      return (
        <div className="bg-stone-900/60 border border-stone-800 rounded-2xl p-3">
          <div className="text-xs text-stone-500 mb-1">{label}</div>
          <div className="flex items-baseline gap-0.5">
            <span className="font-display text-2xl text-stone-100">{value}</span>
            <span className="text-stone-500 text-xs">{unit}</span>
          </div>
        </div>
      );
    }

    // ============== GOALS VIEW ==============
    function GoalsView({ profile, goals, unlocked, sessions, onUpdateGoals, onUpdateProfile }) {
      const [daily, setDaily] = useState(goals.dailyMinutes);
      const [weekly, setWeekly] = useState(goals.weeklyMinutes);

      const daysToTarget = profile?.targetDate ? daysBetween(todayStr(), profile.targetDate) : 0;
      const totalJourney = profile?.targetDate ? daysBetween(profile.startDate, profile.targetDate) : 0;
      const elapsed = totalJourney - daysToTarget;
      const progressPct = totalJourney > 0 ? (elapsed / totalJourney) * 100 : 0;

      const save = () => onUpdateGoals({ dailyMinutes: daily, weeklyMinutes: weekly });

      return (
        <div className="px-5 pt-safe pb-4">
          <div className="mb-6">
            <div className="text-xs text-stone-500 tracking-widest font-semibold">YOUR JOURNEY</div>
            <h1 className="text-3xl font-bold text-stone-100 mt-1">목표 & 업적</h1>
          </div>

          {profile?.targetDate && (
            <div className="bg-gradient-to-br from-emerald-900/40 via-stone-900 to-amber-900/30 border border-emerald-500/20 rounded-3xl p-5 mb-4 relative overflow-hidden">
              <div className="absolute top-0 right-0 text-7xl opacity-10">🏆</div>
              <div className="relative z-10">
                <div className="text-xs text-emerald-400 tracking-widest font-semibold mb-1">PRO 자격증 D-DAY</div>
                <div className="font-display text-6xl text-stone-100 leading-none mb-2">{daysToTarget}</div>
                <div className="text-stone-400 text-sm mb-4">{profile.targetDate} 까지</div>
                <div className="h-2 bg-stone-800 rounded-full overflow-hidden">
                  <div className="h-full bg-gradient-to-r from-emerald-500 to-amber-400 rounded-full transition-all"
                    style={{ width: `${Math.min(100, progressPct)}%` }}></div>
                </div>
                <div className="text-xs text-stone-500 mt-2 font-mono">{progressPct.toFixed(1)}% 진행 · 시작 {profile.startDate}</div>
              </div>
            </div>
          )}

          <div className="bg-stone-900/60 border border-stone-800 rounded-2xl p-5 mb-4">
            <h2 className="text-lg font-bold text-stone-100 mb-4">훈련 목표</h2>
            <div className="mb-5">
              <div className="flex justify-between mb-2">
                <span className="text-sm text-stone-300">하루 목표</span>
                <span className="font-mono text-emerald-400 font-bold">{daily}분</span>
              </div>
              <input type="range" min="30" max="480" step="15" value={daily}
                onChange={(e) => setDaily(parseInt(e.target.value))} />
              <div className="flex justify-between text-xs text-stone-500 mt-1">
                <span>30분</span><span>8시간</span>
              </div>
            </div>
            <div className="mb-4">
              <div className="flex justify-between mb-2">
                <span className="text-sm text-stone-300">주간 목표</span>
                <span className="font-mono text-emerald-400 font-bold">{Math.round(weekly / 60)}시간</span>
              </div>
              <input type="range" min="180" max="3360" step="60" value={weekly}
                onChange={(e) => setWeekly(parseInt(e.target.value))} />
              <div className="flex justify-between text-xs text-stone-500 mt-1">
                <span>3시간</span><span>56시간</span>
              </div>
            </div>
            <button onClick={save}
              className="w-full bg-emerald-500 text-white font-bold py-3 rounded-xl active:scale-95 transition-transform">
              목표 저장
            </button>
          </div>

          <div className="bg-stone-900/60 border border-stone-800 rounded-2xl p-5 mb-4">
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-lg font-bold text-stone-100">업적</h2>
              <div className="font-mono text-sm text-stone-400">{unlocked.length} / {ACHIEVEMENTS.length}</div>
            </div>
            <div className="grid grid-cols-3 gap-3">
              {ACHIEVEMENTS.map(a => {
                const got = unlocked.includes(a.id);
                return (
                  <div key={a.id}
                    className={`rounded-2xl p-3 text-center border ${got ? 'bg-gradient-to-br from-amber-500/20 to-emerald-500/10 border-amber-500/30' : 'bg-stone-900/50 border-stone-800 opacity-50'}`}>
                    <div className={`text-3xl mb-1 ${got ? '' : 'grayscale'}`}>{a.icon}</div>
                    <div className={`text-xs font-semibold ${got ? 'text-stone-100' : 'text-stone-500'}`}>{a.name}</div>
                    <div className="text-[10px] text-stone-500 mt-0.5 leading-tight">{a.desc}</div>
                  </div>
                );
              })}
            </div>
          </div>

          <button
            onClick={() => {
              const name = prompt('이름 변경', profile.name);
              if (name) onUpdateProfile({ ...profile, name });
            }}
            className="w-full bg-stone-900/60 border border-stone-800 rounded-2xl p-4 flex items-center justify-between text-left">
            <div>
              <div className="text-xs text-stone-500">이름</div>
              <div className="font-semibold text-stone-100">{profile.name}</div>
            </div>
            <ChevronRight size={18} className="text-stone-500" />
          </button>

          <button
            onClick={() => {
              if (confirm('정말 모든 데이터를 초기화할까요? 이 작업은 되돌릴 수 없어요.')) {
                localStorage.clear();
                location.reload();
              }
            }}
            className="w-full mt-3 bg-stone-900/30 border border-stone-800 rounded-2xl p-3 text-stone-500 text-sm">
            데이터 초기화
          </button>
        </div>
      );
    }

    // ============== ADD MODAL ==============
    function AddSessionModal({ onSave, onClose }) {
      const [category, setCategory] = useState('driver');
      const [duration, setDuration] = useState(60);
      const [notes, setNotes] = useState('');
      const [date, setDate] = useState(todayStr());

      const submit = () => {
        const now = new Date();
        onSave({ category, duration, notes, date, hour: now.getHours() });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end" onClick={onClose}>
          <div className="w-full bg-stone-950 border-t border-stone-800 rounded-t-3xl p-5 anim-slide-up max-h-[90vh] overflow-y-auto pb-safe-nav"
            onClick={(e) => e.stopPropagation()}>
            <div className="w-12 h-1 bg-stone-700 rounded-full mx-auto mb-5"></div>
            <div className="flex items-center justify-between mb-5">
              <h2 className="text-xl font-bold text-stone-100">훈련 기록</h2>
              <button onClick={onClose} className="text-stone-500 p-1"><X size={20} /></button>
            </div>

            <div className="mb-4">
              <div className="text-sm text-stone-400 mb-2">카테고리</div>
              <div className="grid grid-cols-5 gap-2">
                {CATEGORIES.map(cat => {
                  const Icon = cat.icon;
                  const active = category === cat.id;
                  return (
                    <button key={cat.id} onClick={() => setCategory(cat.id)}
                      className={`rounded-2xl p-3 flex flex-col items-center gap-1 transition-all ${
                        active ? `bg-gradient-to-br ${cat.gradient} text-white shadow-lg` : `${cat.soft} ${cat.text}`
                      }`}>
                      <Icon size={20} />
                      <span className="text-xs font-semibold leading-tight">{cat.name}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="mb-4">
              <div className="flex items-center justify-between mb-2">
                <span className="text-sm text-stone-400">훈련 시간</span>
                <span className="font-mono text-emerald-400 font-bold text-lg">{duration}분</span>
              </div>
              <input type="range" min="15" max="300" step="15" value={duration}
                onChange={(e) => setDuration(parseInt(e.target.value))} />
              <div className="flex justify-between text-xs text-stone-500 mt-1">
                <span>15분</span><span>5시간</span>
              </div>
              <div className="flex gap-2 mt-3">
                {[30, 60, 90, 120, 180].map(m => (
                  <button key={m} onClick={() => setDuration(m)}
                    className={`flex-1 py-2 rounded-xl text-xs font-semibold ${
                      duration === m ? 'bg-emerald-500 text-white' : 'bg-stone-900 text-stone-400 border border-stone-800'
                    }`}>
                    {m}분
                  </button>
                ))}
              </div>
            </div>

            <div className="mb-4">
              <div className="text-sm text-stone-400 mb-2">날짜</div>
              <input type="date" value={date} onChange={(e) => setDate(e.target.value)}
                className="w-full bg-stone-900 border border-stone-800 rounded-xl px-4 py-3 text-stone-100 focus:border-emerald-500 outline-none" />
            </div>

            <div className="mb-5">
              <div className="text-sm text-stone-400 mb-2">메모 <span className="text-stone-600 text-xs">(선택)</span></div>
              <textarea value={notes} onChange={(e) => setNotes(e.target.value)}
                placeholder="오늘의 느낌, 개선할 점, 좋았던 샷..." rows={3}
                className="w-full bg-stone-900 border border-stone-800 rounded-xl px-4 py-3 text-stone-100 placeholder-stone-600 focus:border-emerald-500 outline-none resize-none" />
            </div>

            <button onClick={submit}
              className="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-emerald-500/30 active:scale-95 transition-transform">
              기록 저장
            </button>
          </div>
        </div>
      );
    }

    // ============== BOTTOM NAV ==============
    function BottomNav({ tab, setTab, onAdd }) {
      const tabs = [
        { id: 'home', label: '홈', icon: HomeIcon },
        { id: 'log', label: '기록', icon: BookOpen },
        { id: 'stats', label: '통계', icon: BarChart3 },
        { id: 'goals', label: '목표', icon: Trophy },
      ];

      return (
        <nav className="fixed bottom-0 left-0 right-0 z-40">
          <div className="bg-stone-950/90 backdrop-blur-xl border-t border-stone-800 px-2 pt-2 pb-safe-nav">
            <div className="flex items-center justify-around relative">
              {tabs.slice(0, 2).map(t => {
                const Icon = t.icon;
                const active = tab === t.id;
                return (
                  <button key={t.id} onClick={() => setTab(t.id)}
                    className={`flex flex-col items-center gap-1 py-2 px-4 ${active ? 'text-emerald-400' : 'text-stone-500'}`}>
                    <Icon size={20} />
                    <span className="text-xs font-medium">{t.label}</span>
                  </button>
                );
              })}
              <button onClick={onAdd}
                className="bg-gradient-to-br from-emerald-500 to-emerald-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-emerald-500/40 -translate-y-3 glow-emerald active:scale-95 transition-transform">
                <Plus size={26} strokeWidth={2.5} />
              </button>
              {tabs.slice(2).map(t => {
                const Icon = t.icon;
                const active = tab === t.id;
                return (
                  <button key={t.id} onClick={() => setTab(t.id)}
                    className={`flex flex-col items-center gap-1 py-2 px-4 ${active ? 'text-emerald-400' : 'text-stone-500'}`}>
                    <Icon size={20} />
                    <span className="text-xs font-medium">{t.label}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </nav>
      );
    }

    // ============== RENDER ==============
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
